<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うどんかぞえうたリズムゲーム</title>
    <style>
        :root {
            --primary: #ff5722;
            --secondary: #ffc107;
            --bg-color: #1a1a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 0;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 820px;
            background: linear-gradient(135deg, #2c3e50, #111);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 12px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0,0,0,0.6);
            z-index: 10;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .score-box, .combo-box, .miss-box { text-align: center; }
        .label { font-size: 10px; color: #aaa; }
        .value { font-size: 17px; font-weight: bold; color: var(--secondary); }
        .miss-value { font-size: 17px; font-weight: bold; color: #f44336; }

        .stage-container {
            position: relative;
            height: 190px;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 3px dashed rgba(255,255,255,0.2);
            overflow: hidden;
        }

        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }
        
        .bowl {
            width: 120px; height: 42px;
            background: #e0e0e0;
            border-bottom-left-radius: 60px; border-bottom-right-radius: 60px;
            border: 3px solid #b0b0b0;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            margin-top: 5px;
        }
        .bowl-text { font-size: 12px; font-weight: bold; color: #d32f2f; letter-spacing: 2px; }

        .play-area {
            position: relative; flex: 1;
            display: flex; justify-content: space-between;
            padding: 0 5px; background: rgba(0,0,0,0.3); overflow: hidden;
        }
        .lane {
            position: relative; width: 19%; height: 100%;
            background: rgba(255,255,255,0.03);
            border-left: 1px solid rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; align-items: center;
        }
        .lane-title {
            font-size: 9px; font-weight: bold; color: #ffca28; margin-top: 5px; opacity: 0.85;
            background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 4px;
        }
        .target-line {
            position: absolute; bottom: 75px; width: 100%; height: 6px;
            background: var(--secondary); box-shadow: 0 0 12px var(--secondary); z-index: 4;
        }
        
        .note {
            position: absolute; width: 90%; height: 44px; border-radius: 10px;
            background: linear-gradient(135deg, rgba(255,152,0,0.9), rgba(245,124,0,0.9));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            border: 2px solid rgba(255,255,255,0.9); z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            top: -50px;
        }
        
        #feedback {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 26px; font-weight: bold; pointer-events: none; z-index: 20; opacity: 0;
            transition: opacity 0.1s; text-align: center; white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .control-panel {
            height: 90px; background: rgba(0,0,0,0.8);
            display: flex; justify-content: space-around; align-items: center; padding: 0 5px;
        }
        .hit-btn {
            width: 19%; height: 65px;
            background: linear-gradient(135deg, #ff7043, #d84315);
            border: 2px solid #ffccbc; border-radius: 10px;
            color: white; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hit-btn:active { transform: scale(0.92); background: #bf360c; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; text-align: center;
        }
        .btn-main {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white; border: none; padding: 14px 35px;
            font-size: 18px; font-weight: bold; border-radius: 30px;
            cursor: pointer; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn-main:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        
        #countdown-overlay {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            font-size: 56px; font-weight: bold; color: var(--secondary);
            text-shadow: 0 0 15px rgba(255,193,7,0.8); z-index: 50; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <div class="score-box"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
            <div class="combo-box"><div class="label">COMBO</div><div id="combo" class="value">0</div></div>
            <div class="miss-box"><div class="label">MISS残数</div><div id="miss-left" class="miss-value">20</div></div>
        </div>

        <div class="stage-container">
            <video class="bg-video" autoplay loop muted playsinline preload="auto">
                <source src="videoplayback.mp4" type="video/mp4">
            </video>
            <div class="bowl"><div class="bowl-text">ヒガシマル</div></div>
        </div>

        <div id="countdown-overlay" class="hidden">8</div>

        <div class="play-area">
            <div class="lane" data-lane="0"><div class="lane-title">きつね</div></div>
            <div class="lane" data-lane="1"><div class="lane-title">たぬき</div></div>
            <div class="lane" data-lane="2"><div class="lane-title">てんぷら</div></div>
            <div class="lane" data-lane="3"><div class="lane-title">つきみ</div></div>
            <div class="lane" data-lane="4"><div class="lane-title">おにく</div></div>
            <div class="target-line"></div>
            <div id="feedback">PERFECT!</div>
        </div>

        <div class="control-panel">
            <button class="hit-btn" data-lane="0">きつね</button>
            <button class="hit-btn" data-lane="1">たぬき</button>
            <button class="hit-btn" data-lane="2">てんぷら</button>
            <button class="hit-btn" data-lane="3">つきみ</button>
            <button class="hit-btn" data-lane="4">おにく</button>
        </div>

        <div id="start-screen" class="overlay">
            <h2 style="color:var(--secondary); margin-bottom:10px; font-size: 24px;">✨ うどんかぞえうた ✨</h2>
            <p style="font-size:12px; color:#ccc; line-height:1.6; max-width: 320px; margin-bottom: 15px;">
                レーンに一致する具材アイコンをタップしよう！<br>
                違うおかずや関係ない場所を押すとMISSになります。<br>
                <b>MISSが20回</b>に達するとゲームオーバーです。
            </p>
            <button class="btn-main" id="start-btn">ゲームスタート！</button>
        </div>

        <div id="result-screen" class="overlay hidden">
            <h2 id="result-title" style="color:var(--secondary); font-size: 24px;">🎉 クリア！おめでとう！ 🎉</h2>
            <div id="res-score" style="font-size:20px; margin:10px 0; font-weight: bold;">SCORE: 0</div>
            <div id="res-detail" style="font-size:12px; color:#ccc; margin-bottom:15px; line-height:1.6;"></div>
            <button class="btn-main" id="restart-btn">もう一度プレイ</button>
        </div>
    </div>

    <script>
        const INGREDIENTS = [
            { name: "きつね", icon: "🦊" },
            { name: "たぬき", icon: "🦝" },
            { name: "てんぷら", icon: "🍤" },
            { name: "つきみ", icon: "🥚" },
            { name: "おにく", icon: "🥩" }
        ];
        
        const START_DELAY = 10.0; 
        const TOTAL_GAME_DURATION = 135.0; // 8秒カウント込みで2分15秒

        const basePattern = [
            { t: 0.0, lane: 0, type: 0 },
            { t: 1.5, lane: 1, type: 1 },
            { t: 3.0, lane: 2, type: 2 },
            { t: 4.5, lane: 3, type: 1 }, 
            { t: 6.0, lane: 3, type: 3 },
            { t: 7.5, lane: 4, type: 4 },
            { t: 9.5, lane: 0, type: 4 }, 
            { t: 11.0, lane: 0, type: 0 },
            { t: 12.5, lane: 1, type: 1 }
        ];

        let RAW_TIMINGS = [];
        for (let i = 0; i < 12; i++) {
            basePattern.forEach(note => {
                let timing = note.t + (i * 11.0);
                if (timing < 130.0) {
                    RAW_TIMINGS.push({
                        t: timing,
                        lane: note.lane,
                        type: note.type
                    });
                }
            });
        }
        RAW_TIMINGS.push({ t: 131.0, lane: 0, type: 0 });
        RAW_TIMINGS.push({ t: 132.2, lane: 1, type: 1 });
        RAW_TIMINGS.push({ t: 133.4, lane: 2, type: 2 });

        const MAX_MISS_ALLOWED = 20;
        let score = 0, combo = 0, missCount = 0;
        let perfectCount = 0, goodCount = 0;
        let gameActive = false, startTime = 0;
        let activeNotes = [], countdownTimer = null, animId = null;
        
        const defaultAudio = new Audio('udon.mp3');
        defaultAudio.volume = 0.9;
        
        const bgVideo = document.querySelector('.bg-video');
        const lanes = document.querySelectorAll('.lane');

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880.00, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.log(e);
            }
        }

        function startGame() {
            score = 0; 
            combo = 0; 
            missCount = 0;
            perfectCount = 0;
            goodCount = 0;

            document.getElementById('score').innerText = '0';
            document.getElementById('combo').innerText = '0';
            document.getElementById('miss-left').innerText = MAX_MISS_ALLOWED;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            document.querySelectorAll('.note').forEach(el => el.remove());

            activeNotes = RAW_TIMINGS.map((item, index) => {
                const targetTime = START_DELAY + item.t;
                const el = document.createElement('div');
                el.className = 'note';
                el.innerText = INGREDIENTS[item.type].icon;
                lanes[item.lane].appendChild(el);
                return {
                    index,
                    el,
                    hit: false,
                    lane: item.lane,
                    type: item.type,
                    targetTime: targetTime
                };
            });

            defaultAudio.currentTime = 0;
            defaultAudio.play().catch(err => console.log(err));
            
            if (bgVideo) {
                bgVideo.currentTime = 0;
                bgVideo.play().catch(err => console.log(err));
            }

            const cdEl = document.getElementById('countdown-overlay');
            cdEl.classList.remove('hidden');
            let timeLeft = 8;
            cdEl.innerText = timeLeft;

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    cdEl.innerText = timeLeft;
                } else {
                    cdEl.innerText = "START!";
                    setTimeout(() => cdEl.classList.add('hidden'), 600);
                    clearInterval(countdownTimer);
                }
            }, 1000);

            gameActive = true;
            startTime = performance.now();
            updateGame();
        }

        function updateGame() {
            if (!gameActive) return;
            const elapsed = (performance.now() - startTime) / 1000;
            const playAreaHeight = lanes[0].clientHeight;
            const fallDuration = 2.0;

            let allCleared = true;

            activeNotes.forEach((obj) => {
                if (!obj.hit) {
                    allCleared = false;
                    const dropStartTime = obj.targetTime - fallDuration;

                    if (elapsed >= dropStartTime) {
                        const progress = (elapsed - dropStartTime) / fallDuration;
                        const targetLineOffset = 75;
                        const totalTravel = playAreaHeight - targetLineOffset;
                        const currentTop = progress * totalTravel;

                        if (progress <= 1.25) {
                            obj.el.style.top = currentTop + 'px';
                        }
                    }

                    if (elapsed > obj.targetTime + 0.35) {
                        obj.hit = true;
                        obj.el.style.opacity = '0.2';
                        if (obj.type === obj.lane) {
                            handleMiss();
                        }
                    }
                }
            });

            if (missCount >= MAX_MISS_ALLOWED || elapsed >= TOTAL_GAME_DURATION) {
                endGame(missCount < MAX_MISS_ALLOWED);
                return;
            }

            if (allCleared && elapsed > START_DELAY) {
                endGame(true);
                return;
            }

            animId = requestAnimationFrame(updateGame);
        }

        function judgeLane(laneIndex) {
            if (!gameActive) return;
            const elapsed = (performance.now() - startTime) / 1000;
            
            let hitFound = false;

            activeNotes.forEach((obj) => {
                if (obj.lane === laneIndex && !obj.hit) {
                    const diff = Math.abs(obj.targetTime - elapsed);
                    if (diff < 0.35) {
                        hitFound = true;
                        obj.hit = true;
                        obj.el.remove();

                        if (obj.type === laneIndex) {
                            if (diff < 0.15) {
                                score += 300; combo++;
                                perfectCount++;
                                showFeedback('PERFECT!', '#ffeb3b');
                            } else {
                                score += 100; combo++;
                                goodCount++;
                                showFeedback('GOOD', '#8bc34a');
                            }
                            document.getElementById('score').innerText = score;
                            document.getElementById('combo').innerText = combo;
                            playSound('success');
                        } else {
                            handleMiss();
                        }
                    }
                }
            });

            if (!hitFound) {
                handleMiss();
            }
        }

        function handleMiss() {
            combo = 0;
            missCount++;
            const left = MAX_MISS_ALLOWED - missCount;
            document.getElementById('combo').innerText = combo;
            document.getElementById('miss-left').innerText = Math.max(0, left);
            showFeedback('MISS', '#f44336');
            playSound('miss');
        }

        function showFeedback(text, color) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.style.color = color;
            fb.style.opacity = '1';
            setTimeout(() => fb.style.opacity = '0', 300);
        }

        function endGame(isClear) {
            gameActive = false;
            cancelAnimationFrame(animId);
            if (countdownTimer) clearInterval(countdownTimer);
            defaultAudio.pause();
            
            if (bgVideo) {
                bgVideo.pause();
            }

            const titleEl = document.getElementById('result-title');
            const detailEl = document.getElementById('res-detail');

            if (isClear) {
                titleEl.innerText = '🎉 曲を完走！おめでとう！ 🎉';
                titleEl.style.color = '#ffc107';
            } else {
                titleEl.innerText = '😭 残念！もう一度チャレンジしてね！ 😭';
                titleEl.style.color = '#f44336';
            }

            detailEl.innerHTML = `
                PERFECT: ${perfectCount}回<br>
                GOOD: ${goodCount}回<br>
                MISS: ${missCount}回
            `;

            document.getElementById('res-score').innerText = 'SCORE: ' + score;
            document.getElementById('result-screen').classList.remove('hidden');
        }

        document.querySelectorAll('.hit-btn').forEach(btn => {
            const lane = parseInt(btn.getAttribute('data-lane'));
            btn.addEventListener('click', () => judgeLane(lane));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                judgeLane(lane);
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
