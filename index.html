<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うどんかぞえうたリズムゲーム</title>
    <style>
        :root {
            --primary: #ff5722;
            --secondary: #ffc107;
            --bg-color: #1a1a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%; height: 100%;
            overflow-x: hidden; overflow-y: auto;
            background-color: var(--bg-color); color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding: 10px 0; touch-action: manipulation;
        }

        #game-container {
            position: relative; width: 100%; max-width: 480px; height: 820px;
            background: linear-gradient(135deg, #2c3e50, #111);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden;
            border: 4px solid #333; border-radius: 12px; margin: auto;
        }

        /* --- ゲーム画面のスタイル（省略） --- */
        /* ※前回のコードと同じため、見やすさのために省略していますが、 */
        /* 本番のファイルにはすべてのスタイルを入れてください。 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(0,0,0,0.6); z-index: 10; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .score-box, .combo-box, .miss-box { text-align: center; }
        .label { font-size: 10px; color: #aaa; }
        .value { font-size: 17px; font-weight: bold; color: var(--secondary); }
        .miss-value { font-size: 17px; font-weight: bold; color: #f44336; }
        .stage-container { position: relative; height: 190px; background: radial-gradient(circle, #3a4454 0%, #111823 100%); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 3px dashed rgba(255,255,255,0.2); overflow: hidden; }
        .spotlight { position: absolute; top: -50%; left: 50%; width: 200%; height: 200%; background: conic-gradient(from 0deg at 50% 50%, rgba(255,193,7,0.15) 0deg, transparent 30deg, rgba(255,193,7,0.15) 60deg, transparent 90deg, rgba(255,193,7,0.15) 120deg, transparent 150deg); transform: translate(-50%, 0); animation: rotateLight 12s linear infinite; pointer-events: none; z-index: 1; }
        @keyframes rotateLight { 0% { transform: translate(-50%, 0) rotate(0deg); } 100% { transform: translate(-50%, 0) rotate(360deg); } }
        .bowl { width: 120px; height: 40px; background: #e0e0e0; border-bottom-left-radius: 60px; border-bottom-right-radius: 60px; border: 3px solid #b0b0b0; display: flex; align-items: center; justify-content: center; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .bowl-text { font-size: 12px; font-weight: bold; color: #d32f2f; letter-spacing: 2px; }
        .dancers-stage { position: relative; width: 100%; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 10px; z-index: 4; height: 90px; }
        .dancer-card { display: flex; flex-direction: column; align-items: center; transform-origin: bottom center; }
        .dancer-icon { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .dancer-label { font-size: 9px; font-weight: bold; margin-top: 3px; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 4px; color: var(--secondary); }
        @keyframes danceLeftRight { 0% { transform: translateY(0) rotate(-12deg) scale(0.95); } 50% { transform: translateY(-12px) rotate(0deg) scale(1.1); } 100% { transform: translateY(0) rotate(12deg) scale(0.95); } }
        .dancing .dancer-card:nth-child(1) { animation: danceLeftRight 0.4s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(2) { animation: danceLeftRight 0.4s 0.08s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(3) { animation: danceLeftRight 0.4s 0.16s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(4) { animation: danceLeftRight 0.4s 0.24s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(5) { animation: danceLeftRight 0.4s 0.32s infinite alternate ease-in-out; }
        .play-area { position: relative; flex: 1; display: flex; justify-content: space-between; padding: 0 5px; background: rgba(0,0,0,0.3); overflow: hidden; }
        .lane { position: relative; width: 19%; height: 100%; background: rgba(255,255,255,0.03); border-left: 1px solid rgba(255,255,255,0.08); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; }
        .lane-title { font-size: 9px; font-weight: bold; color: #ffca28; margin-top: 5px; opacity: 0.85; background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 4px; }
        .target-line { position: absolute; bottom: 130px; width: 100%; height: 6px; background: var(--secondary); box-shadow: 0 0 12px var(--secondary); z-index: 4; }
        .note { position: absolute; width: 90%; height: 44px; border-radius: 10px; background: linear-gradient(135deg, rgba(255,152,0,0.9), rgba(245,124,0,0.9)); display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid rgba(255,255,255,0.9); z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.4); top: -50px; }
        #feedback { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.1s; text-align: center; white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .control-panel { height: 90px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-around; align-items: center; padding: 0 5px; }
        .hit-btn { width: 19%; height: 65px; background: linear-gradient(135deg, #ff7043, #d84315); border: 2px solid #ffccbc; border-radius: 10px; color: white; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .hit-btn:active { transform: scale(0.92); background: #bf360c; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; }
        .btn-main { background: linear-gradient(135deg, #ff9800, #f57c00); color: white; border: none; padding: 14px 35px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-main:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        #countdown-overlay { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); font-size: 56px; font-weight: bold; color: var(--secondary); text-shadow: 0 0 15px rgba(255,193,7,0.8); z-index: 50; pointer-events: none; }

        /* --- ✨ 新・夕焼けエンディング演出 ✨ --- */
        #ending-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* イラストのような美しい夕焼けのグラデーション */
            background: linear-gradient(to bottom, #ff6b4a 0%, #ff9e59 40%, #ffc107 70%, #ff8f00 100%);
            overflow: hidden; z-index: 200; display: flex; flex-direction: column; align-items: center;
        }

        /* 夕日 */
        .sun {
            position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
            width: 100px; height: 100px;
            background: radial-gradient(circle, #fff 30%, #ffca28 60%, rgba(255,255,255,0) 100%);
            border-radius: 50%; filter: blur(5px);
        }

        /* 地面（草原） */
        .ground {
            position: absolute; bottom: 0; width: 100%; height: 45%;
            background: linear-gradient(to bottom, #aed581 0%, #558b2f 100%);
        }

        /* 遠くへ続く道（SVG） */
        .road-container {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; height: 45%; overflow: hidden;
        }
        
        .road-svg {
            width: 100%; height: 100%;
        }

        /* 動く白線（アニメーション） */
        .road-dashed-line {
            stroke: rgba(255,255,255,0.8);
            stroke-width: 5;
            stroke-dasharray: 20, 30; /* 線の長さ、間隔 */
            animation: roadMove 1s infinite linear;
        }

        @keyframes roadMove {
            to { stroke-dashoffset: -50; } /* 手前に流れる動き */
        }

        /* 走るキツネ（後ろ姿） */
        .fox-back-view {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            font-size: 80px;  /* イラストに合わせて少し大きめに */
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            animation: foxRun 0.4s infinite alternate ease-in-out;
        }

        /* キツネが走っているような上下運動とわずかな傾き */
        @keyframes foxRun {
            0% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
            100% { transform: translateX(-50%) translateY(-10px) rotate(2deg); }
        }

    </style>
</head>
<body>
    <div id="game-container">
        <!-- ゲーム画面のHTML（前回と同じ） -->
        <div class="header">
            <div class="score-box"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
            <div class="combo-box"><div class="label">COMBO</div><div id="combo" class="value">0</div></div>
            <div class="miss-box"><div class="label">MISS</div><div id="miss-count" class="miss-value">0</div></div>
        </div>
        <div class="stage-container" id="stage-container">
            <div class="spotlight"></div>
            <div class="bowl"><div class="bowl-text">ヒガシマル</div></div>
            <div class="dancers-stage dancing">
                <div class="dancer-card"><div class="dancer-icon">🦊</div><div class="dancer-label">きつね</div></div>
                <div class="dancer-card"><div class="dancer-icon">🦝</div><div class="dancer-label">たぬき</div></div>
                <div class="dancer-card"><div class="dancer-icon">🍤</div><div class="dancer-label">てんぷら</div></div>
                <div class="dancer-card"><div class="dancer-icon">🥚</div><div class="dancer-label">つきみ</div></div>
                <div class="dancer-card"><div class="dancer-icon">🥩</div><div class="dancer-label">おにく</div></div>
            </div>
        </div>
        <div id="countdown-overlay" class="hidden">3</div>
        <div class="play-area">
            <div class="lane"><div class="lane-title">きつね</div><div class="note-container"></div></div>
            <div class="lane"><div class="lane-title">たぬき</div><div class="note-container"></div></div>
            <div class="lane"><div class="lane-title">てんぷら</div><div class="note-container"></div></div>
            <div class="lane"><div class="lane-title">つきみ</div><div class="note-container"></div></div>
            <div class="lane"><div class="lane-title">おにく</div><div class="note-container"></div></div>
            <div class="target-line"></div>
            <div id="feedback">PERFECT</div>
        </div>
        <div class="control-panel">
            <button class="hit-btn">きつね</button>
            <button class="hit-btn">たぬき</button>
            <button class="hit-btn">てんぷら</button>
            <button class="hit-btn">つきみ</button>
            <button class="hit-btn">おにく</button>
        </div>

        <!-- スタート画面 -->
        <div id="start-screen" class="overlay">
            <h1 style="color:var(--secondary); margin-bottom:10px;">うどんかぞえうた<br>リズムゲーム</h1>
            <p style="font-size:14px; color:#ccc; line-height:1.6; max-width: 320px; margin-bottom: 20px;">
                具材に合わせてリズムよくボタンを押そう！<br>
                10回ミスするとゲームオーバーです。
            </p>
            <button class="btn-main" id="start-btn">ゲームスタート</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="overlay hidden">
            <h1 style="color:#f44336;">GAME OVER</h1>
            <p id="final-score-over" style="font-size:24px; margin: 15px 0;">SCORE: 0</p>
            <button class="btn-main" id="retry-btn">もう一度プレイ</button>
        </div>

        <!-- ✨ 新・夕焼けエンディング画面 ✨ -->
        <div id="ending-screen" class="hidden">
            <div class="sun"></div>
            <div class="ground"></div>
            
            <!-- 遠近感のある道 -->
            <div class="road-container">
                <svg class="road-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- 道本体 -->
                    <path d="M 45 0 L 55 0 L 100 100 L 0 100 Z" fill="#795548" />
                    <!-- 動くセンターライン -->
                    <line x1="50" y1="0" x2="50" y2="100" class="road-dashed-line" />
                </svg>
            </div>
            
            <!-- 走るキツネの後ろ姿（絵文字をCSSでアニメーション） -->
            <div class="fox-back-view">🦊</div>
            
            <div class="overlay" style="background:none; z-index:10; top:auto; bottom:5%; height:auto;">
                <h2 style="color:var(--secondary); text-shadow:0 2px 4px rgba(0,0,0,0.5);">CLEAR! ありがとう！</h2>
                <p id="final-score-end" style="font-size:20px; color:#fff; margin: 10px 0;">SCORE: 0</p>
                <button class="btn-main" id="back-to-title-btn">タイトルへもどる</button>
            </div>
        </div>
    </div>

    <!-- ゲームロジック（前回と同じ、最後にエンディング呼び出しを追加） -->
    <!-- ※前回のコードと同じため省略していますが、本番のファイルにはすべてのスクリプトを入れてください。 -->
    <script>
        // --- 変数定義、音声、初期化、ノート生成、判定等は前回と同じ ---
        const INGREDIENTS = ["🦊", "🦝", "🍤", "🥚", "🥩"];
        let score = 0, combo = 0, missCount = 0, gameActive = false, startTime, activeNotes = [], noteIdCounter = 0;
        const TARGET_Y = 660, PERFECT_RANGE = 20, GOOD_RANGE = 50, NOTE_SPEED = 4;
        const totalUdonDuration = 120; // udon.mp3の長さ（秒）。適宜調整。

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const udonAudio = new Audio('udon.mp3');
        const endingAudio = new Audio('ending.mp3');

        // 音声アンロック用処理
        function unlockAudio() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            udonAudio.play().then(() => udonAudio.pause()).catch(e => console.error(e));
            endingAudio.play().then(() => endingAudio.pause()).catch(e => console.error(e));
            document.removeEventListener('click', unlockAudio);
        }
        document.addEventListener('click', unlockAudio);

        // ゲームクリア（エンディング）を呼び出す処理
        function gameClear() {
            gameActive = false;
            udonAudio.pause();
            
            // エンディング音楽を再生
            endingAudio.currentTime = 0;
            endingAudio.play().catch(e => console.error("endingAudio.play error:", e));

            document.getElementById('final-score-end').innerText = `SCORE: ${score}`;
            document.getElementById('ending-screen').classList.remove('hidden');
        }

        // --- ゲームメインループ、スタート、オーバー等の関数は前回と同じ ---
        // (省略) ... updateGame関数内のクリア判定部分 ...
        function updateGame() {
            if (!gameActive) return;
            const currentTime = audioCtx.currentTime;
            const elapsedSinceStart = currentTime - startTime;

            // 具材ノートの移動と削除
            activeNotes.forEach(note => {
                note.y += NOTE_SPEED;
                note.element.style.transform = `translateY(${note.y}px)`;
                if (note.y > TARGET_Y + GOOD_RANGE) {
                    note.element.remove();
                    note.isMissed = true;
                    handleMiss();
                }
            });
            activeNotes = activeNotes.filter(note => !note.isMissed);

            // ミス回数によるゲームオーバー判定
            if (missCount >= 10) { gameOver(); return; }

            // ⚽ 曲が最後まで流れたらクリア判定 ⚽
            if (elapsedSinceStart >= totalUdonDuration) {
                gameClear();
                return;
            }

            requestAnimationFrame(updateGame);
        }
        // (省略) ... その他の関数 ...
        
        // スタート、リトライ、タイトルへ戻るボタンのイベント
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);
        document.getElementById('back-to-title-btn').addEventListener('click', () => {
            endingAudio.pause();
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

    </script>
</body>
</html>
