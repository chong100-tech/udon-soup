<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うどんかぞえうたリズムゲーム</title>
    <style>
        :root {
            --primary: #ff5722;
            --secondary: #ffc107;
            --bg-color: #1a1a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 0;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 820px;
            background: linear-gradient(135deg, #2c3e50, #111);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 12px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0,0,0,0.6);
            z-index: 10;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .score-box, .combo-box, .miss-box { text-align: center; }
        .label { font-size: 10px; color: #aaa; }
        .value { font-size: 17px; font-weight: bold; color: var(--secondary); }
        .miss-value { font-size: 17px; font-weight: bold; color: #f44336; }

        .stage-container {
            position: relative;
            height: 190px;
            background: radial-gradient(circle, #3a4454 0%, #111823 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 3px dashed rgba(255,255,255,0.2);
            overflow: hidden;
        }

        .spotlight {
            position: absolute;
            top: -50%; left: 50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(255,193,7,0.15) 0deg, transparent 30deg, rgba(255,193,7,0.15) 60deg, transparent 90deg, rgba(255,193,7,0.15) 120deg, transparent 150deg);
            transform: translate(-50%, 0);
            animation: rotateLight 12s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes rotateLight {
            0% { transform: translate(-50%, 0) rotate(0deg); }
            100% { transform: translate(-50%, 0) rotate(360deg); }
        }

        .bowl {
            width: 120px; height: 40px;
            background: #e0e0e0;
            border-bottom-left-radius: 60px; border-bottom-right-radius: 60px;
            border: 3px solid #b0b0b0;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .bowl-text { font-size: 12px; font-weight: bold; color: #d32f2f; letter-spacing: 2px; }

        .dancers-stage {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0 10px;
            z-index: 4;
            height: 90px;
        }
        .dancer-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
        }
        .dancer-icon {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .dancer-label {
            font-size: 9px;
            font-weight: bold;
            margin-top: 3px;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            border-radius: 4px;
            color: var(--secondary);
        }

        @keyframes danceLeftRight {
            0% { transform: translateY(0) rotate(-12deg) scale(0.95); }
            50% { transform: translateY(-12px) rotate(0deg) scale(1.1); }
            100% { transform: translateY(0) rotate(12deg) scale(0.95); }
        }

        .dancing .dancer-card:nth-child(1) { animation: danceLeftRight 0.4s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(2) { animation: danceLeftRight 0.4s 0.08s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(3) { animation: danceLeftRight 0.4s 0.16s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(4) { animation: danceLeftRight 0.4s 0.24s infinite alternate ease-in-out; }
        .dancing .dancer-card:nth-child(5) { animation: danceLeftRight 0.4s 0.32s infinite alternate ease-in-out; }

        .play-area {
            position: relative; flex: 1;
            display: flex; justify-content: space-between;
            padding: 0 5px; background: rgba(0,0,0,0.3); overflow: hidden;
        }
        .lane {
            position: relative; width: 19%; height: 100%;
            background: rgba(255,255,255,0.03);
            border-left: 1px solid rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; align-items: center;
        }
        .lane-title {
            font-size: 9px; font-weight: bold; color: #ffca28; margin-top: 5px; opacity: 0.85;
            background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 4px;
        }
        /* 判定ライン（黄色の線）を画面の中央付近（下から230px）に引き上げました */
        .target-line {
            position: absolute; bottom: 230px; width: 100%; height: 6px;
            background: var(--secondary); box-shadow: 0 0 12px var(--secondary); z-index: 4;
        }
        
        .note {
            position: absolute; width: 90%; height: 44px; border-radius: 10px;
            background: linear-gradient(135deg, rgba(255,152,0,0.9), rgba(245,124,0,0.9));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            border: 2px solid rgba(255,255,255,0.9); z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            top: -50px;
            transition: opacity 0.2s; /* フェードアウト用 */
        }
        
        #feedback {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 26px; font-weight: bold; pointer-events: none; z-index: 20; opacity: 0;
            transition: opacity 0.1s; text-align: center; white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .control-panel {
            height: 90px; background: rgba(0,0,0,0.8);
            display: flex; justify-content: space-around; align-items: center; padding: 0 5px;
        }
        .hit-btn {
            width: 19%; height: 65px;
            background: linear-gradient(135deg, #ff7043, #d84315);
            border: 2px solid #ffccbc; border-radius: 10px;
            color: white; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hit-btn:active { transform: scale(0.92); background: #bf360c; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; text-align: center;
        }
        .btn-main {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white; border: none; padding: 14px 35px;
            font-size: 18px; font-weight: bold; border-radius: 30px;
            cursor: pointer; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn-main:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        
        #countdown-overlay {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            font-size: 56px; font-weight: bold; color: var(--secondary);
            text-shadow: 0 0 15px rgba(255,193,7,0.8); z-index: 50; pointer-events: none;
        }

        /* --- 流星の路（エンディング演出） --- */
        #ending-screen {
            background: linear-gradient(180deg, #0b0b1a 0%, #1a0b2e 100%);
            overflow: hidden;
        }
        .shooting-star {
            position: absolute; width: 100px; height: 2px;
            background: linear-gradient(90deg, #fff, transparent);
            transform: rotate(-35deg); opacity: 0;
            animation: shoot 4s infinite linear;
        }
        @keyframes shoot {
            0% { transform: translate(300px, -100px) rotate(-35deg); opacity: 1; }
            30% { transform: translate(-200px, 200px) rotate(-35deg); opacity: 0; }
            100% { transform: translate(-200px, 200px) rotate(-35deg); opacity: 0; }
        }
        .road-horizon {
            position: absolute; bottom: 0; width: 100%; height: 55%;
            background: linear-gradient(180deg, #222 0%, #0d0d14 100%);
            clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
            border-top: 2px solid rgba(255,255,255,0.2);
        }
        .walking-troop {
            position: absolute; bottom: 120px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 20px;
            animation: walkIntoDistance 8s infinite linear;
        }
        @keyframes walkIntoDistance {
            0% { transform: translateX(-50%) scale(1); bottom: 100px; opacity: 1; }
            100% { transform: translateX(-50%) scale(0.2); bottom: 320px; opacity: 0.6; }
        }
        .back-walker {
            font-size: 28px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            animation: stepBounce 0.6s infinite alternate ease-in-out;
        }
        @keyframes stepBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <div class="score-box"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
            <div class="combo-box"><div class="label">COMBO</div><div id="combo" class="value">0</div></div>
            <div class="miss-box"><div class="label">MISS残数</div><div id="miss-left" class="miss-value">20</div></div>
        </div>

        <div class="stage-container">
            <div class="spotlight"></div>
            <div class="bowl"><div class="bowl-text">ヒガシマル</div></div>
            
            <div class="dancers-stage dancing">
                <div class="dancer-card"><div class="dancer-icon">🦊</div><div class="dancer-label">きつね</div></div>
                <div class="dancer-card"><div class="dancer-icon">🦝</div><div class="dancer-label">たぬき</div></div>
                <div class="dancer-card"><div class="dancer-icon">🍤</div><div class="dancer-label">てんぷら</div></div>
                <div class="dancer-card"><div class="dancer-icon">🥚</div><div class="dancer-label">つきみ</div></div>
                <div class="dancer-card"><div class="dancer-icon">🥩</div><div class="dancer-label">おにく</div></div>
            </div>
        </div>

        <div id="countdown-overlay" class="hidden">8</div>

        <div class="play-area">
            <div class="lane" data-lane="0"><div class="lane-title">きつね</div></div>
            <div class="lane" data-lane="1"><div class="lane-title">たぬき</div></div>
            <div class="lane" data-lane="2"><div class="lane-title">てんぷら</div></div>
            <div class="lane" data-lane="3"><div class="lane-title">つきみ</div></div>
            <div class="lane" data-lane="4"><div class="lane-title">おにく</div></div>
            <div class="target-line"></div>
            <div id="feedback">PERFECT!</div>
        </div>

        <div class="control-panel">
            <button class="hit-btn" data-lane="0">きつね</button>
            <button class="hit-btn" data-lane="1">たぬき</button>
            <button class="hit-btn" data-lane="2">てんぷら</button>
            <button class="hit-btn" data-lane="3">つきみ</button>
            <button class="hit-btn" data-lane="4">おにく</button>
        </div>

        <!-- スタート画面 -->
        <div id="start-screen" class="overlay">
            <h2 style="color:var(--secondary); margin-bottom:5px; font-size: 24px;">✨ うどんかぞえうた ✨</h2>
            <p style="font-size:11px; color:#ccc; line-height:1.5; max-width: 320px; margin-bottom: 10px;">
                判定ラインを中央付近に引き上げました！<br>
                リズムに合わせて正しくタップしよう♪<br>
                <b>MISSが20回</b>に達するとゲームオーバーです。
            </p>
            <button class="btn-main" id="start-btn">ゲームスタート！</button>
            <button class="btn-main" id="test-ending-btn" style="background: linear-gradient(135deg, #4caf50, #2e7d32); margin-top: 10px; font-size: 13px; padding: 10px 20px;">🎬 [テスト] エンディングを見る</button>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="overlay hidden">
            <h2 id="result-title" style="color:var(--secondary); font-size: 24px;">🎉 クリア！おめでとう！ 🎉</h2>
            <div id="res-score" style="font-size:20px; margin:10px 0; font-weight: bold;">SCORE: 0</div>
            <div id="res-detail" style="font-size:12px; color:#ccc; margin-bottom:15px; line-height:1.6;"></div>
            <p id="ending-countdown-msg" style="font-size: 11px; color: #aaa; margin-top: 10px;">5秒後にエンディングへ進みます...</p>
            <button class="btn-main" id="restart-btn" style="margin-top: 10px; padding: 10px 20px; font-size: 14px;">もう一度プレイ</button>
        </div>

        <!-- 流星の路風エンディング画面 -->
        <div id="ending-screen" class="overlay hidden">
            <div class="shooting-star" style="top: 20%; left: 70%; animation-delay: 0s;"></div>
            <div class="shooting-star" style="top: 40%; left: 80%; animation-delay: 2s;"></div>
            <div class="road-horizon"></div>
            
            <div class="walking-troop">
                <div class="back-walker">🦊</div>
                <div class="back-walker">🦝</div>
                <div class="back-walker">🍤</div>
                <div class="back-walker">🥚</div>
                <div class="back-walker">🥩</div>
            </div>

            <div style="position: absolute; bottom: 40px; z-index: 10; text-align: center; width: 100%;">
                <h3 style="color: var(--secondary); font-size: 18px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,0,0,0.8);">Starlit Journey</h3>
                <p style="font-size: 11px; color: #bbb; margin-bottom: 15px; text-shadow: 0 0 5px rgba(0,0,0,0.8);">果てなき空は いつも自由だ</p>
                <button class="btn-main" id="ending-restart-btn" style="padding: 10px 25px; font-size: 15px;">タイトルへもどる</button>
            </div>
        </div>
    </div>

    <script>
        const INGREDIENTS = [
            { name: "きつね", icon: "🦊" },
            { name: "たぬき", icon: "🦝" },
            { name: "てんぷら", icon: "🍤" },
            { name: "つきみ", icon: "🥚" },
            { name: "おにく", icon: "🥩" }
        ];
        
        const START_DELAY = 10.0; 
        const TOTAL_GAME_DURATION = 135.0;
        const MAX_MISS_ALLOWED = 20;

        let score = 0, combo = 0, missCount = 0;
        let perfectCount = 0, goodCount = 0;
        let gameActive = false, isCountingDown = false;
        let startTime = 0;
        let activeNotes = [], countdownTimer = null, animId = null;
        let resultTimeout = null;
        
        const defaultAudio = new Audio('udon.mp3');
        defaultAudio.volume = 0.9;

        const endingAudio = new Audio('ending.mp3'); 
        endingAudio.volume = 0.8;
        
        const lanes = document.querySelectorAll('.lane');

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'perfect') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880.00, now);
                    osc.frequency.setValueAtTime(1318.51, now + 0.08);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'good') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    gain.gain.setValueAtTime(0.65, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110, now);
                    osc.frequency.setValueAtTime(70, now + 0.12);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.log(e);
            }
        }

        function generateRandomTimings() {
            let timings = [];
            let currentTime = 0.0;
            while (currentTime < 125.0) {
                const randomLane = Math.floor(Math.random() * 5);
                let noteType;
                if (Math.random() < 0.80) {
                    noteType = randomLane;
                } else {
                    let otherTypes = [0, 1, 2, 3, 4].filter(t => t !== randomLane);
                    noteType = otherTypes[Math.floor(Math.random() * otherTypes.length)];
                }
                timings.push({ t: currentTime, lane: randomLane, type: noteType });
                currentTime += 0.9 + Math.random() * 0.6;
            }
            return timings;
        }

        function triggerEnding() {
            gameActive = false;
            isCountingDown = false;
            cancelAnimationFrame(animId);
            if (countdownTimer) clearInterval(countdownTimer);
            if (resultTimeout) clearTimeout(resultTimeout);
            defaultAudio.pause();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('ending-screen').classList.remove('hidden');
            
            endingAudio.currentTime = 0;
            endingAudio.play().catch(err => console.log("Ending audio play error:", err));
        }

        function startGame() {
            score = 0; combo = 0; missCount = 0;
            perfectCount = 0; goodCount = 0;
            if (resultTimeout) clearTimeout(resultTimeout);
            endingAudio.pause();

            document.getElementById('score').innerText = '0';
            document.getElementById('combo').innerText = '0';
            document.getElementById('miss-left').innerText = MAX_MISS_ALLOWED;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('ending-screen').classList.add('hidden');

            document.querySelectorAll('.note').forEach(el => el.remove());

            const rawTimings = generateRandomTimings();
            activeNotes = rawTimings.map((item, index) => {
                const targetTime = START_DELAY + item.t;
                const el = document.createElement('div');
                el.className = 'note';
                el.innerText = INGREDIENTS[item.type].icon;
                lanes[item.lane].appendChild(el);
                return { id: index, el: el, removed: false, lane: item.lane, type: item.type, targetTime: targetTime };
            });

            defaultAudio.currentTime = 0;
            defaultAudio.play().catch(err => console.log(err));

            const cdEl = document.getElementById('countdown-overlay');
            cdEl.classList.add('hidden');
            let timeLeft = 8;
            cdEl.innerText = timeLeft;
            isCountingDown = true; 
            cdEl.classList.remove('hidden');

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    cdEl.innerText = timeLeft;
                } else {
                    cdEl.innerText = "START!";
                    isCountingDown = false; 
                    setTimeout(() => cdEl.classList.add('hidden'), 600);
                    clearInterval(countdownTimer);
                }
            }, 1000);

            gameActive = true;
            startTime = performance.now();
            updateGame();
        }

        function updateGame() {
            if (!gameActive) return;
            const elapsed = (performance.now() - startTime) / 1000;
            const playAreaHeight = lanes[0].clientHeight;
            const fallDuration = 1.6; // 少しテンポよく落ちるように調整
            const targetLineBottom = 230; // 半分あたりの高さ（下から230px）

            let allCleared = true;

            activeNotes.forEach((obj) => {
                if (!obj.removed) {
                    allCleared = false;
                    const dropStartTime = obj.targetTime - fallDuration;

                    if (elapsed >= dropStartTime) {
                        const progress = (elapsed - dropStartTime) / fallDuration;
                        const totalTravel = playAreaHeight - targetLineBottom;
                        const currentTop = progress * totalTravel;

                        if (progress <= 1.3) {
                            obj.el.style.top = currentTop + 'px';
                        }
                    }

                    const targetLinePixelFromTop = playAreaHeight - targetLineBottom;
                    const noteTop = parseFloat(obj.el.style.top) || -50;

                    // 判定ラインを少し過ぎたら（＋35px）、フェードアウトしながら消去してMISS判定
                    if (noteTop > targetLinePixelFromTop + 35) {
                        obj.removed = true;
                        obj.el.style.opacity = '0'; // フェードアウト
                        setTimeout(() => obj.el.remove(), 200);
                        
                        if (obj.type === obj.lane) {
                            handleMiss();
                        }
                    }
                }
            });

            if (missCount >= MAX_MISS_ALLOWED || elapsed >= TOTAL_GAME_DURATION) {
                endGame(missCount < MAX_MISS_ALLOWED);
                return;
            }

            if (allCleared && elapsed > START_DELAY) {
                endGame(true);
                return;
            }

            animId = requestAnimationFrame(updateGame);
        }

        function judgeLane(laneIndex) {
            if (!gameActive || isCountingDown) return;
            
            const playAreaHeight = lanes[0].clientHeight;
            const targetLinePixelFromTop = playAreaHeight - 230; 
            let hitFound = false;

            for (let obj of activeNotes) {
                if (obj.lane === laneIndex && !obj.removed) {
                    const noteTop = parseFloat(obj.el.style.top) || -50;
                    const noteCenter = noteTop + 22; 
                    const targetCenter = targetLinePixelFromTop + 3; 
                    const distance = noteCenter - targetCenter; 
                    const absDistance = Math.abs(distance);

                    // 判定許容範囲（±45px）
                    if (absDistance <= 45) {
                        hitFound = true;
                        obj.removed = true; 
                        obj.el.style.opacity = '0'; // 叩かれたらフェードアウト
                        setTimeout(() => obj.el.remove(), 150);    

                        if (obj.type === laneIndex) {
                            if (absDistance <= 14) {
                                score += 300; combo++;
                                perfectCount++;
                                showFeedback('PERFECT!', '#ffeb3b');
                                playSound('perfect');
                            } else {
                                score += 100; combo++;
                                goodCount++;
                                showFeedback('GOOD', '#8bc34a');
                                playSound('good');
                            }
                            document.getElementById('score').innerText = score;
                            document.getElementById('combo').innerText = combo;
                        } else {
                            handleMiss();
                        }
                        break; 
                    }
                }
            }

            if (!hitFound) {
                handleMiss();
            }
        }

        function handleMiss() {
            combo = 0;
            missCount++;
            const left = MAX_MISS_ALLOWED - missCount;
            document.getElementById('combo').innerText = combo;
            document.getElementById('miss-left').innerText = Math.max(0, left);
            showFeedback('MISS', '#f44336');
            playSound('miss');
        }

        function showFeedback(text, color) {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.innerText = text;
            feedbackEl.style.color = color;
            feedbackEl.style.opacity = '1';
            setTimeout(() => feedbackEl.style.opacity = '0', 300);
        }

        function endGame(isClear) {
            gameActive = false;
            isCountingDown = false;
            cancelAnimationFrame(animId);
            if (countdownTimer) clearInterval(countdownTimer);
            defaultAudio.pause();

            const titleEl = document.getElementById('result-title');
            const detailEl = document.getElementById('res-detail');

            if (isClear) {
                titleEl.innerText = '🎉 曲を完走！おめでとう！ 🎉';
                titleEl.style.color = '#ffc107';
            } else {
                titleEl.innerText = '😭 残念！もう一度チャレンジしてね！ 😭';
                titleEl.style.color = '#f44336';
            }

            detailEl.innerHTML = `
                PERFECT: ${perfectCount}回<br>
                GOOD: ${goodCount}回<br>
                MISS: ${missCount}回
            `;

            document.getElementById('res-score').innerText = 'SCORE: ' + score;
            document.getElementById('result-screen').classList.remove('hidden');

            resultTimeout = setTimeout(() => {
                triggerEnding();
            }, 5000);
        }

        document.querySelectorAll('.hit-btn').forEach(btn => {
            const lane = parseInt(btn.getAttribute('data-lane'));
            btn.addEventListener('click', () => judgeLane(lane));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                judgeLane(lane);
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('test-ending-btn').addEventListener('click', triggerEnding);
        document.getElementById('ending-restart-btn').addEventListener('click', () => {
            endingAudio.pause();
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });
    </script>
</body>
</html>
