<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うどんかぞえうたリズムゲーム</title>
    <style>
        :root {
            --primary: #ff5722;
            --secondary: #ffc107;
            --bg-color: #1a1a2e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 0;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 820px;
            background: linear-gradient(135deg, #2c3e50, #111);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 12px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0,0,0,0.6);
            z-index: 10;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .score-box, .combo-box, .miss-box { text-align: center; }
        .label { font-size: 10px; color: #aaa; }
        .value { font-size: 17px; font-weight: bold; color: var(--secondary); }
        .miss-value { font-size: 17px; font-weight: bold; color: #f44336; }

        /* ステージ＆ダンサー演出（CM完全再現） */
        .stage-container {
            position: relative;
            height: 180px;
            background: radial-gradient(circle, #3a4454 0%, #1c222b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            border-bottom: 3px dashed rgba(255,255,255,0.2);
            overflow: hidden;
        }
        .bowl {
            position: absolute;
            bottom: 8px;
            width: 130px; height: 45px;
            background: #e0e0e0;
            border-bottom-left-radius: 65px; border-bottom-right-radius: 65px;
            border: 4px solid #b0b0b0;
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .bowl-text { font-size: 13px; font-weight: bold; color: #d32f2f; letter-spacing: 2px; }
        
        .dancers-row {
            position: absolute; bottom: 22px;
            display: flex; justify-content: space-around;
            width: 95%; z-index: 3;
        }
        .dancer {
            display: flex; flex-direction: column; align-items: center;
            transform-origin: bottom center;
            transition: transform 0.2s;
        }
        .dancer-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: #fff; border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .dancer-name {
            font-size: 8px; margin-top: 2px; background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 4px;
            white-space: nowrap;
        }

        /* CM風ダンスアニメーション（歩行＆手足フリフリ） */
        .cm-walking {
            animation: cmWalk 0.3s infinite alternate ease-in-out;
        }
        @keyframes cmWalk {
            0% { transform: translateY(0) rotate(-6deg) scaleX(0.95); }
            100% { transform: translateY(-8px) rotate(6deg) scaleX(1.05); }
        }

        .cm-dancing {
            animation: cmDance 0.45s infinite alternate ease-in-out;
        }
        @keyframes cmDance {
            0% { transform: translateY(0) rotate(-12deg) scale(0.95); }
            50% { transform: translateY(-10px) rotate(0deg) scale(1.05); }
            100% { transform: translateY(0) rotate(12deg) scale(0.95); }
        }

        .jump {
            animation: jumpAnim 0.3s ease-out;
        }
        @keyframes jumpAnim {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-22px) scale(1.25) rotate(15deg); }
            100% { transform: translateY(0) scale(1); }
        }

        /* 5レーンプレイエリア */
        .play-area {
            position: relative; flex: 1;
            display: flex; justify-content: space-between;
            padding: 0 5px; background: rgba(0,0,0,0.3); overflow: hidden;
        }
        .lane {
            position: relative; width: 19%; height: 100%;
            background: rgba(255,255,255,0.03);
            border-left: 1px solid rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; align-items: center;
        }
        .lane-title {
            font-size: 10px; font-weight: bold; color: #ffca28; margin-top: 5px; opacity: 0.8;
            background: rgba(0,0,0,0.4); padding: 2px 4px; border-radius: 4px;
        }
        .target-line {
            position: absolute; bottom: 75px; width: 100%; height: 6px;
            background: var(--secondary); box-shadow: 0 0 12px var(--secondary); z-index: 4;
        }
        .note {
            position: absolute; width: 90%; height: 42px; border-radius: 8px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: #fff;
            border: 2px solid rgba(255,255,255,0.8); z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        
        #feedback {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 26px; font-weight: bold; pointer-events: none; z-index: 20; opacity: 0;
            transition: opacity 0.1s; text-align: center; white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        /* 5ボタンコントロールパネル */
        .control-panel {
            height: 90px; background: rgba(0,0,0,0.8);
            display: flex; justify-content: space-around; align-items: center; padding: 0 5px;
        }
        .hit-btn {
            width: 19%; height: 65px;
            background: linear-gradient(135deg, #ff7043, #d84315);
            border: 2px solid #ffccbc; border-radius: 10px;
            color: white; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hit-btn:active { transform: scale(0.92); background: #bf360c; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; text-align: center;
        }
        .btn-main {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white; border: none; padding: 14px 35px;
            font-size: 18px; font-weight: bold; border-radius: 30px;
            cursor: pointer; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn-main:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        
        #countdown-overlay {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; font-weight: bold; color: var(--secondary);
            text-shadow: 0 0 15px rgba(255,193,7,0.8); z-index: 50; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <div class="score-box"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
            <div class="combo-box"><div class="label">COMBO</div><div id="combo" class="value">0</div></div>
            <div class="miss-box"><div class="label">MISS残数</div><div id="miss-left" class="miss-value">20</div></div>
        </div>

        <div class="stage-container">
            <div class="dancers-row">
                <div class="dancer" id="dancer-0"><div class="dancer-avatar">🦊</div><div class="dancer-name">きつね</div></div>
                <div class="dancer" id="dancer-1"><div class="dancer-avatar">🦝</div><div class="dancer-name">たぬき</div></div>
                <div class="dancer" id="dancer-2"><div class="dancer-avatar">🍤</div><div class="dancer-name">てんぷら</div></div>
                <div class="dancer" id="dancer-3"><div class="dancer-avatar">🥚</div><div class="dancer-name">つきみ</div></div>
                <div class="dancer" id="dancer-4"><div class="dancer-avatar">🥩</div><div class="dancer-name">おにく</div></div>
            </div>
            <div class="bowl"><div class="bowl-text">ヒガシマル</div></div>
        </div>

        <div id="countdown-overlay" class="hidden">10</div>

        <div class="play-area">
            <div class="lane" data-lane="0"><div class="lane-title">きつね</div></div>
            <div class="lane" data-lane="1"><div class="lane-title">たぬき</div></div>
            <div class="lane" data-lane="2"><div class="lane-title">てんぷら</div></div>
            <div class="lane" data-lane="3"><div class="lane-title">つきみ</div></div>
            <div class="lane" data-lane="4"><div class="lane-title">おにく</div></div>
            <div class="target-line"></div>
            <div id="feedback">PERFECT!</div>
        </div>

        <div class="control-panel">
            <button class="hit-btn" data-lane="0">きつね</button>
            <button class="hit-btn" data-lane="1">たぬき</button>
            <button class="hit-btn" data-lane="2">てんぷら</button>
            <button class="hit-btn" data-lane="3">つきみ</button>
            <button class="hit-btn" data-lane="4">おにく</button>
        </div>

        <div id="start-screen" class="overlay">
            <h2 style="color:var(--secondary); margin-bottom:10px; font-size: 24px;">✨ うどんかぞえうた ✨</h2>
            <p style="font-size:12px; color:#ccc; line-height:1.6; max-width: 320px; margin-bottom: 10px;">
                レーンに表示されている<b>正しい具材</b>の時にタップ！<br>
                違う具材をタップしたり見逃すとMISS！<br>
                ※スタート後10秒後に具材が落ちてきます。
            </p>
            <button class="btn-main" id="start-btn">ゲームスタート！</button>
        </div>

        <div id="result-screen" class="overlay hidden">
            <h2 id="result-title" style="color:var(--secondary); font-size: 26px;">🎉 クリア！おめでとう！ 🎉</h2>
            <div id="res-score" style="font-size:22px; margin:15px 0; font-weight: bold;">SCORE: 0</div>
            <div id="res-detail" style="font-size:13px; color:#ccc; margin-bottom:15px; line-height:1.5;"></div>
            <button class="btn-main" id="restart-btn">もう一度プレイ</button>
        </div>
    </div>

    <script>
        const INGREDIENTS = ["きつね", "たぬき", "てんぷら", "つきみ", "おにく"];
        const START_DELAY = 10.0; // 10秒後にノーツ開始

        // ランダムノーツ生成（10秒以降に流れる）
        const SONG_NOTES = [
            { time: START_DELAY + 1.0, lane: 0, text: "きつね" },
            { time: START_DELAY + 2.0, lane: 1, text: "たぬき" },
            { time: START_DELAY + 3.0, lane: 2, text: "てんぷら" },
            { time: START_DELAY + 4.0, lane: 3, text: "たぬき" }, // ダミー（MISS誘発）
            { time: START_DELAY + 5.0, lane: 3, text: "つきみ" },
            { time: START_DELAY + 6.0, lane: 4, text: "おにく" },
            { time: START_DELAY + 7.5, lane: 0, text: "おにく" }, // ダミー
            { time: START_DELAY + 8.5, lane: 0, text: "きつね" },
            { time: START_DELAY + 9.5, lane: 1, text: "たぬき" },
            { time: START_DELAY + 10.5, lane: 2, text: "てんぷら" },
            { time: START_DELAY + 11.5, lane: 3, text: "つきみ" },
            { time: START_DELAY + 12.5, lane: 4, text: "おにく" },
            { time: START_DELAY + 14.0, lane: 1, text: "きつね" }, // ダミー
            { time: START_DELAY + 15.0, lane: 1, text: "たぬき" },
            { time: START_DELAY + 16.0, lane: 2, text: "てんぷら" },
            { time: START_DELAY + 17.5, lane: 4, text: "おにく" },
            { time: START_DELAY + 19.0, lane: 0, text: "きつね" },
            { time: START_DELAY + 20.0, lane: 3, text: "つきみ" }
        ];

        const MAX_MISS_ALLOWED = 20;
        let score = 0, combo = 0, missCount = 0;
        let gameActive = false, startTime = 0;
        let activeNotes = [], noteElements = [], animId = null, countdownTimer = null;
        
        const defaultAudio = new Audio('udon.mp3');
        defaultAudio.volume = 0.9;

        const lanes = document.querySelectorAll('.lane');
        const dancers = document.querySelectorAll('.dancer');

        function startGame() {
            score = 0; 
            combo = 0; 
            missCount = 0;

            document.getElementById('score').innerText = '0';
            document.getElementById('combo').innerText = '0';
            document.getElementById('miss-left').innerText = MAX_MISS_ALLOWED;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            noteElements.forEach(n => n.el.remove());
            noteElements = [];

            activeNotes = JSON.parse(JSON.stringify(SONG_NOTES));
            activeNotes.forEach((note, index) => {
                const el = document.createElement('div');
                el.className = 'note';
                el.innerText = note.text;
                lanes[note.lane].appendChild(el);
                noteElements.push({ index, el, hit: false, lane: note.lane, text: note.text, targetTime: note.time });
            });

            // 音源再生
            defaultAudio.currentTime = 0;
            defaultAudio.play().catch(err => console.log(err));

            // CM再現ダンスアニメーションの開始
            dancers.forEach((d, idx) => {
                d.classList.remove('cm-walking', 'cm-dancing');
                setTimeout(() => d.classList.add('cm-walking'), idx * 300);
                setTimeout(() => d.classList.add('cm-dancing'), 3000);
            });

            // 10秒カウントダウン演出
            const cdEl = document.getElementById('countdown-overlay');
            cdEl.classList.remove('hidden');
            let timeLeft = 10;
            cdEl.innerText = timeLeft;

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    cdEl.innerText = timeLeft;
                } else {
                    cdEl.innerText = "START!";
                    setTimeout(() => cdEl.classList.add('hidden'), 800);
                    clearInterval(countdownTimer);
                }
            }, 1000);

            gameActive = true;
            startTime = performance.now();
            updateGame();
        }

        function updateGame() {
            if (!gameActive) return;
            const elapsed = (performance.now() - startTime) / 1000;
            const areaHeight = lanes[0].clientHeight;

            activeNotes.forEach((obj) => {
                if (obj.hit) return;

                const progress = 1.0 - ((obj.targetTime - elapsed) / 2.0);
                const pos = areaHeight - (progress * (areaHeight - 75));

                if (obj.targetTime - elapsed < -0.35) {
                    obj.hit = true;
                    obj.el.style.opacity = '0.2';
                    // 正しい具材を見逃した場合はMISS
                    if (obj.text === INGREDIENTS[obj.lane]) {
                        handleMiss();
                    }
                } else if (progress >= 0 && progress <= 1.5) {
                    obj.el.style.bottom = pos + 'px';
                }
            });

            if (missCount >= MAX_MISS_ALLOWED) {
                endGame(false);
                return;
            }

            const lastNoteTime = SONG_NOTES[SONG_NOTES.length - 1].time;
            if (elapsed > lastNoteTime + 3.0) {
                endGame(true);
                return;
            }

            animId = requestAnimationFrame(updateGame);
        }

        function judgeLane(laneIndex) {
            if (!gameActive) return;
            const elapsed = (performance.now() - startTime) / 1000;
            const targetIngredient = INGREDIENTS[laneIndex];

            let hitFound = false;

            activeNotes.forEach((obj) => {
                if (obj.lane === laneIndex && !obj.hit) {
                    const diff = Math.abs(obj.targetTime - elapsed);
                    if (diff < 0.3) {
                        obj.hit = true;
                        obj.el.remove();
                        hitFound = true;

                        // レーンと具材が一致しているかチェック
                        if (obj.text === targetIngredient) {
                            if (diff < 0.12) {
                                score += 300; combo++;
                                showFeedback('PERFECT!', '#ffeb3b');
                            } else {
                                score += 100; combo++;
                                showFeedback('GOOD', '#8bc34a');
                            }
                            document.getElementById('score').innerText = score;
                            document.getElementById('combo').innerText = combo;

                            const dancerEl = document.getElementById(`dancer-${laneIndex}`);
                            if (dancerEl) {
                                dancerEl.classList.add('jump');
                                setTimeout(() => dancerEl.classList.remove('jump'), 300);
                            }
                        } else {
                            // 違う具材を押した場合はMISS
                            handleMiss();
                        }
                    }
                }
            });

            // ノーツが無い時に適当に連打した場合はペナルティなし（またはペナルティが必要な場合は追加可）
        }

        function handleMiss() {
            combo = 0;
            missCount++;
            const left = MAX_MISS_ALLOWED - missCount;
            document.getElementById('combo').innerText = combo;
            document.getElementById('miss-left').innerText = Math.max(0, left);
            showFeedback('MISS', '#f44336');
        }

        function showFeedback(text, color) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.style.color = color;
            fb.style.opacity = '1';
            setTimeout(() => fb.style.opacity = '0', 300);
        }

        function endGame(isClear) {
            gameActive = false;
            cancelAnimationFrame(animId);
            if (countdownTimer) clearInterval(countdownTimer);
            defaultAudio.pause();

            dancers.forEach(d => d.classList.remove('cm-walking', 'cm-dancing'));

            const titleEl = document.getElementById('result-title');
            const detailEl = document.getElementById('res-detail');

            if (isClear) {
                titleEl.innerText = '🎉 クリア！おめでとう！ 🎉';
                titleEl.style.color = '#ffc107';
                detailEl.innerText = `最後まで演奏しきりました！\nMISS回数: ${missCount}回`;
            } else {
                titleEl.innerText = '😭 残念！もう一度チャレンジしてね！ 😭';
                titleEl.style.color = '#f44336';
                detailEl.innerText = `MISSが20回に達してしまいました…！`;
            }

            document.getElementById('res-score').innerText = 'SCORE: ' + score;
            document.getElementById('result-screen').classList.remove('hidden');
        }

        // タップ＆クリックイベント登録（5ボタン対応）
        document.querySelectorAll('.hit-btn').forEach(btn => {
            const lane = parseInt(btn.getAttribute('data-lane'));
            btn.addEventListener('click', () => judgeLane(lane));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                judgeLane(lane);
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
</html>
